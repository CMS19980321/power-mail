spring:
  application:
    name: member-service
  cloud:
    nacos:
      server-addr: 192.168.194.147:8848
      username: nacos
      password:  nacos
      discovery:
        namespace: 4f22dcd4-713f-4c84-9ba1-e43ebd32cd88
        group: A_GROUP
        service: ${spring.application.name}
      config:
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
        prefix: ${spring.application.name}
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  profiles:
    active: dev


